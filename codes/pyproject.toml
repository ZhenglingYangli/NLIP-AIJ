[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nlipsat"
version = "0.2.0"
description = "Python API wrapper for the NLIPSat research toolkit"
requires-python = ">=3.9"
dependencies = [
    "python-sat[pb]>=1.9.dev17",
    "pindakaas>=0.6.1",
    "z3-solver",
]

[project.scripts]
nlipsat = "codes.main:main"

[tool.setuptools]
py-modules = ["telemetry"]
packages = ["solvers", "solvers.baseline", "nlipsat", "codes", "codes.encoders", "codes.solver", "codes.tools"]
