[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nlipsat"
version = "0.2.0"
description = "Python API wrapper for the NLIPSat research toolkit"
requires-python = ">=3.9"
dependencies = [
    "python-sat[pb]>=1.9.dev17",
    "pindakaas>=0.6.1",
    "z3-solver",
]

[project.scripts]
nlipsat = "nlipsat.__main__:main"

[tool.setuptools]
py-modules = ["main", "telemetry"]
packages = ["nlipsat", "encoders", "solver", "tools", "baselines"]
